const express = require("express");
const app = express();
app.use(express.json());

let pedidos = [];

app.post("/order", (req,res)=>{
  pedidos.push(req.body);
  res.send({ok:true});
});

app.get("/orders", (req,res)=>{
  res.json(pedidos);
});

app.listen(3000, ()=>console.log("Servidor activo"));
