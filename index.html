<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BattleZone Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:#121212;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:#000;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00c3ff;
}

/* HERO */
.hero{
padding:40px;
background:linear-gradient(90deg,#000,#1a1a2e);
text-align:center;
}

.hero h1{
font-size:32px;
}

.hero span{
color:#00c3ff;
}

.btn{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#00c3ff;
color:black;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:#1a1a1a;
padding:15px;
border-radius:10px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 15px #00c3ff;
}

.price{
color:#00c3ff;
margin:10px 0;
}

/* CARRITO */
.cart{
position:fixed;
right:0;
top:0;
width:260px;
height:100%;
background:#000;
padding:15px;
border-left:1px solid #222;
}

.cart h2{
margin-bottom:10px;
}

.item{
font-size:14px;
color:#ccc;
margin-bottom:5px;
}

/* BOTONES */
button{
background:#00c3ff;
border:none;
padding:10px;
border-radius:5px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
width:100%;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
padding:15px;
border-radius:50%;
text-decoration:none;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
color:#777;
}
</style>
</head>

<body>

<nav>
<div class="logo">⚡ BattleZone</div>
<div>🛒 <span id="count">0</span></div>
</nav>

<section class="hero">
<h1>Compra <span>Pavos y Skins</span> ⚡</h1>
<p>Entrega rápida • Seguro • +500 clientes</p>
</section>

<div class="grid">

<div class="card">
<h3>1000 Pavos</h3>
<div class="price">$15.000</div>
<button onclick="add('1000 Pavos',15000)">Agregar</button>
</div>

<div class="card">
<h3>Pase de batalla</h3>
<div class="price">$25.000</div>
<button onclick="add('Pase de batalla',25000)">Agregar</button>
</div>

<div class="card">
<h3>Fortnite Crew</h3>
<div class="price">$30.000</div>
<button onclick="add('Fortnite Crew',30000)">Agregar</button>
</div>

<div class="card">
<h3>Skin aleatoria</h3>
<div class="price">$10.000</div>
<button onclick="add('Skin',10000)">Agregar</button>
</div>

</div>

<div class="cart">
<h2>Carrito</h2>
<div id="items"></div>
<h3>Total: $<span id="total">0</span></h3>

<button onclick="comprar()">Finalizar compra</button>
</div>

<a href="https://wa.me/573504449558" class="whatsapp">💬</a>

<footer>
© 2026 BattleZone Store
</footer>

<script>
let cart=[];

function add(name,price){
cart.push({name,price});
render();
}

function render(){
let html="",total=0;

cart.forEach(p=>{
html+=`<div class="item">${p.name} - $${p.price}</div>`;
total+=p.price;
});

document.getElementById("items").innerHTML=html;
document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

function comprar(){
fetch("/order",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({cart})
})
.then(()=> {
alert("✅ Pedido enviado");
cart=[];
render();
});
}
</script>

</body>
</html>
