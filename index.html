 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BattleZone Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
background:#0b0f1a;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
padding:15px;
background:#000;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-weight:bold;
color:#00eaff;
}

/* HERO */
.hero{
background:url("https://i.imgur.com/Z6X9q9T.jpg") center/cover;
padding:80px 20px;
text-align:center;
}

.hero h1{
font-size:32px;
text-shadow:0 0 10px black;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
padding:20px;
}

/* CARD */
.card{
background:#111827;
border-radius:12px;
overflow:hidden;
transition:.3s;
}

.card img{
width:100%;
height:140px;
object-fit:cover;
}

.card-content{
padding:10px;
text-align:center;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 15px #00eaff;
}

.price{
color:#00eaff;
margin:5px 0;
}

/* BOTON */
button{
background:#00eaff;
border:none;
padding:8px;
border-radius:6px;
width:100%;
font-weight:bold;
cursor:pointer;
}

/* BOTON CARRITO */
.cart-btn{
position:fixed;
bottom:20px;
right:20px;
background:#00eaff;
color:black;
padding:15px;
border-radius:50%;
font-size:20px;
}

/* PANEL CARRITO */
.cart-panel{
position:fixed;
top:0;
right:-100%;
width:280px;
height:100%;
background:#020617;
padding:15px;
transition:.3s;
}

.cart-panel.active{
right:0;
}

.item{
font-size:14px;
margin:5px 0;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
padding:15px;
border-radius:50%;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
color:#555;
}
</style>
</head>

<body>

<nav>
<div class="logo">⚡ BattleZone</div>
<div onclick="toggleCart()">🛒 <span id="count">0</span></div>
</nav>

<section class="hero">
<h1>Compra Pavos y Skins 🔥</h1>
</section>

<div class="grid">

<div class="card">
<img src="https://i.imgur.com/8Km9tLL.jpg">
<div class="card-content">
<h3>1000 Pavos</h3>
<div class="price">$15.000</div>
<button onclick="add('1000 Pavos',15000)">Agregar</button>
</div>
</div>

<div class="card">
<img src="https://i.imgur.com/3ZQ3Z4C.jpg">
<div class="card-content">
<h3>Pase batalla</h3>
<div class="price">$25.000</div>
<button onclick="add('Pase batalla',25000)">Agregar</button>
</div>
</div>

<div class="card">
<img src="https://i.imgur.com/4AiXzf8.jpg">
<div class="card-content">
<h3>Fortnite Crew</h3>
<div class="price">$30.000</div>
<button onclick="add('Crew',30000)">Agregar</button>
</div>
</div>

<div class="card">
<img src="https://i.imgur.com/ZF6s192.jpg">
<div class="card-content">
<h3>Skin aleatoria</h3>
<div class="price">$10.000</div>
<button onclick="add('Skin',10000)">Agregar</button>
</div>
</div>

</div>

<!-- BOTON CARRITO -->
<div class="cart-btn" onclick="toggleCart()">🛒</div>

<!-- PANEL -->
<div class="cart-panel" id="cart">
<h2>Carrito</h2>
<div id="items"></div>
<h3>Total: $<span id="total">0</span></h3>
<button onclick="comprar()">Comprar</button>
</div>

<a href="https://wa.me/573504449558" class="whatsapp">💬</a>

<footer>© 2026 BattleZone</footer>

<script>
let cart=[];

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function add(name,price){
cart.push({name,price});
render();
}

function render(){
let html="",total=0;
cart.forEach(p=>{
html+=`<div class="item">${p.name} - $${p.price}</div>`;
total+=p.price;
});
document.getElementById("items").innerHTML=html;
document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

function comprar(){
if(cart.length===0){alert("Agrega algo");return;}

let msg="Hola quiero comprar:%0A";
cart.forEach(p=>{
msg+=`- ${p.name} ($${p.price})%0A`;
});

window.open(`https://wa.me/573504449558?text=${msg}`);
}
</script>

</body>
</html>
